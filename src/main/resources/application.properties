spring.application.name=ridego
spring.datasource.url=jdbc:mysql://localhost:3306/ridego 
# MySQL server localhost par hai, port 3306 hai, aur database ridego hai.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}

# JPA automatically database tables create/update kar sakega jab hum entities banayenge.
